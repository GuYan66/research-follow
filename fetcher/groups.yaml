# 跟踪哪些 AI 顶组。增删关注对象只改本文件。
#
# 字段说明
#   region:   cn | intl                     国内 / 国际
#   kind:     academia | industry            学术界 / 工业界
#   feeds:    官方 RSS/Atom，只接稳定 feed，不爬 HTML
#   members:  每位可填 openalex_id / s2_id / arxiv_name 任意子集，缺哪个跳过哪个源
#
# 关于 ID 的纪律
#   - openalex_id / s2_id 是稳定 ID，优先用；本文件里的 ID 均通过「该人确实署名的论文」反查得到，
#     而不是按姓名搜索的首个结果（中文姓名在 OpenAlex 重名/合档严重）。
#   - arxiv_name 只能按姓名检索，重名风险高：只用于姓名独特的个人，
#     以及 arXiv 上真实存在的「机构作者」（如 DeepSeek-AI、Qwen Team），后者是跟踪国内大厂技术报告的最佳入口。
#   - 没有可靠作者 ID 的工业组允许「0 成员 + 仅 feed」，反之没有 feed 的组就只跟论文。

groups:
  # ---------------- 国际 · 工业界 ----------------
  - id: openai
    name: OpenAI
    name_cn: OpenAI
    region: intl
    kind: industry
    affiliation: OpenAI
    homepage: https://openai.com
    description: GPT / o 系列模型与 Sora 的研发方，重要成果多以官方 News 与技术报告形式发布。
    tags: [llm, agents, multimodal]
    feeds:
      - url: https://openai.com/news/rss.xml
        label: OpenAI News

  - id: google-deepmind
    name: DeepMind
    name_cn: DeepMind
    region: intl
    kind: industry
    affiliation: Google DeepMind
    homepage: https://deepmind.google
    description: Gemini、AlphaFold、Gemini Robotics 等工作的研发方，覆盖基础模型与科学计算。
    tags: [llm, rl, science, robotics]
    feeds:
      - url: https://blog.google/technology/google-deepmind/rss/
        label: Google DeepMind Blog
    members:
      - id: oriol-vinyals
        name: Oriol Vinyals
        role: VP of Research
        openalex_id: A5003562101
        arxiv_name: "Vinyals, Oriol"

  - id: google-research
